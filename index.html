<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunny Spot — find sun where you'll arrive</title>
  <meta name="description" content="Find the closest place that will be sunny when you get there, and the route to drive." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    .leaflet-container { font-family: inherit; }
    .leaflet-popup-content-wrapper { border-radius: 14px; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-sky-100 text-slate-800 antialiased">
  <div class="mx-auto max-w-7xl px-4 py-6 sm:py-10">
    <!-- Header -->
    <header class="mb-6 flex items-center gap-3">
      <div class="grid size-11 place-items-center rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-2xl shadow-lg shadow-orange-500/30">☀️</div>
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">Sunny Spot</h1>
        <p class="text-sm text-slate-500">The closest place that will be sunny <em>when you arrive</em>.</p>
      </div>
    </header>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-[380px_minmax(0,1fr)]">
      <!-- Controls + results -->
      <aside class="min-w-0 space-y-6">
        <form id="form" class="space-y-4 rounded-3xl border border-white/60 bg-white/70 p-5 shadow-xl shadow-orange-900/5 backdrop-blur">
          <div>
            <label for="place" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Starting from</label>
            <div class="flex gap-2">
              <input id="place" type="text" placeholder="City or address" autocomplete="off"
                class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-orange-400 focus:ring-4 focus:ring-orange-100" />
              <button id="locate" type="button" title="Use my location"
                class="grid size-11 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-lg transition hover:border-orange-300 hover:bg-orange-50">📍</button>
            </div>
            <p id="originLabel" class="mt-1.5 truncate text-xs text-slate-400">Type a place or use your location.</p>
          </div>

          <div>
            <label for="start" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Leaving at</label>
            <input id="start" type="datetime-local"
              class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none transition focus:border-orange-400 focus:ring-4 focus:ring-orange-100" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="maxDrive" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Max drive</label>
              <select id="maxDrive" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-orange-400 focus:ring-4 focus:ring-orange-100">
                <option value="1">1 hour</option>
                <option value="2">2 hours</option>
                <option value="3" selected>3 hours</option>
                <option value="4">4 hours</option>
                <option value="5">5 hours</option>
              </select>
            </div>
            <div>
              <label for="stay" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Sunny for</label>
              <select id="stay" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-orange-400 focus:ring-4 focus:ring-orange-100">
                <option value="1">1 hour</option>
                <option value="2" selected>2 hours</option>
                <option value="3">3 hours</option>
                <option value="4">4 hours</option>
              </select>
            </div>
          </div>

          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label for="clouds" class="text-xs font-semibold uppercase tracking-wide text-slate-500">Max cloud cover</label>
              <span id="cloudsVal" class="text-xs font-semibold text-orange-600">30%</span>
            </div>
            <input id="clouds" type="range" min="10" max="60" step="5" value="30" class="w-full accent-orange-500" />
          </div>

          <button id="go" type="submit"
            class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 px-4 py-3 text-sm font-bold text-white shadow-lg shadow-orange-500/30 transition hover:brightness-105 active:scale-[.99] disabled:cursor-wait disabled:opacity-70">
            <span id="goIcon">☀️</span><span id="goText">Find the sun</span>
          </button>
          <p id="status" class="min-h-4 text-center text-xs text-slate-500"></p>
        </form>

        <section id="results" class="hidden space-y-3">
          <h2 class="px-1 text-xs font-semibold uppercase tracking-wide text-slate-500">Best options</h2>
          <ol id="list" class="space-y-2.5"></ol>
        </section>
      </aside>

      <!-- Map -->
      <main class="relative overflow-hidden rounded-3xl border border-white/60 bg-white/70 shadow-xl shadow-orange-900/5">
        <div id="map" class="h-[60vh] min-h-[420px] w-full lg:h-[calc(100vh-10rem)]"></div>
        <div class="pointer-events-none absolute bottom-4 left-4 z-[500] flex flex-wrap gap-2 text-xs font-medium">
          <span class="rounded-full bg-white/90 px-2.5 py-1 shadow"><span class="mr-1 inline-block size-2.5 rounded-full bg-amber-400 align-middle"></span>Sunny on arrival</span>
          <span class="rounded-full bg-white/90 px-2.5 py-1 shadow"><span class="mr-1 inline-block size-2.5 rounded-full bg-slate-400 align-middle"></span>Cloudy / rain</span>
          <span class="rounded-full bg-white/90 px-2.5 py-1 shadow"><span class="mr-1 inline-block size-2.5 rounded-full bg-indigo-500 align-middle"></span>Dark</span>
        </div>
      </main>
    </div>

    <footer class="mt-8 text-center text-xs text-slate-400">
      Weather: <a class="underline hover:text-slate-600" href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> ·
      Routing: <a class="underline hover:text-slate-600" href="https://project-osrm.org" target="_blank" rel="noopener">OSRM</a> ·
      Map: <a class="underline hover:text-slate-600" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>.
      Forecasts are forecasts — bring a jacket.
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
